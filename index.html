<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You - Pop N' Crunch</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Comic+Neue:wght@700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 50%, #ffcc80 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 50px 40px;
      max-width: 620px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      position: relative;
      overflow: hidden;
      border: 8px solid #fff;
    }

    .card::before {
      content: "🍿";
      position: absolute;
      font-size: 180px;
      opacity: 0.08;
      top: -40px;
      left: -20px;
      transform: rotate(-15deg);
      pointer-events: none;
    }

    .card::after {
      content: "✨🍿✨";
      position: absolute;
      font-size: 90px;
      opacity: 0.12;
      bottom: -30px;
      right: -10px;
      transform: rotate(12deg);
      pointer-events: none;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 3.1rem;
      margin: 0 0 0.2em;
      background: linear-gradient(90deg, #e91e63, #ff5722, #ff9800);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 3px 3px 0 #fff, 6px 6px 0 #ffe0b2;
    }

    p {
      font-family: 'Comic Neue', cursive;
      font-size: 1.9rem;
      margin: 0.4em 0 0;
      color: #d81b60;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .highlight {
      color: #ff5722;
      font-size: 2.1rem;
    }

    @media (max-width: 600px) {
      .card { padding: 40px 25px; }
      h1   { font-size: 2.6rem; }
      p    { font-size: 1.6rem; }
      .highlight { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Thank You for Supporting Us!</h1>
    <p>Hope you enjoy every <span class="highlight">Pop N' Crunch</span> 🍿❤️</p>
  </div>

</body>
</html>
